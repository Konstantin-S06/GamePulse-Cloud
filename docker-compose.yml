services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: gamepulse-spark:local
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8082:8080"
      - "7077:7077"

  spark-worker-1:
    image: gamepulse-spark:local
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    ports:
      - "8083:8081"

  spark-worker-2:
    image: gamepulse-spark:local
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    ports:
      - "8084:8081"

  runner:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: gamepulse-airflow:local
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment:
      SPARK_DRIVER_HOST: runner
      HADOOP_USER_NAME: gamepulse
    working_dir: /opt/gamepulse
    volumes:
      - .:/opt/gamepulse
    depends_on:
      - kafka
      - spark-master
    # Airflow image entrypoint expects airflow subcommands; bypass for a long-lived shell host.
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]

  postgres:
    profiles: [airflow]
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow-init:
    profiles: [airflow]
    image: gamepulse-airflow:local
    depends_on:
      - postgres
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: /bin/bash -c "airflow db migrate && airflow users create --username $${AIRFLOW_ADMIN_USER:-admin} --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true"
  airflow-webserver:
    profiles: [airflow]
    image: gamepulse-airflow:local
    depends_on:
      - postgres
      - kafka
      - spark-master
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SPARK_DRIVER_HOST: airflow-webserver
      HADOOP_USER_NAME: gamepulse
    working_dir: /opt/gamepulse
    volumes:
      - .:/opt/gamepulse
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    profiles: [airflow]
    image: gamepulse-airflow:local
    depends_on:
      - postgres
      - kafka
      - spark-master
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SPARK_DRIVER_HOST: airflow-scheduler
      HADOOP_USER_NAME: gamepulse
    working_dir: /opt/gamepulse
    volumes:
      - .:/opt/gamepulse
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler

  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: gamepulse-dashboard:local
    env_file: .env
    volumes:
      - .:/opt/gamepulse
    ports:
      - "8501:8501"

volumes:
  pgdata: